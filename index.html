).innerHTML='<div class="msg error">Проверьте продукт, количество и дату.</div>';return}let data={productId,qty,unit:p.unit||'кг',frequency,customDays,nextAt:new Date(date+'T09:00:00').toISOString()};if(editing){Object.assign(editing,data)}else db.scheduledPurchases.push({id:crypto.randomUUID(),userId,...data,active:true,cancelled:false,createdAt:new Date().toISOString()});save();plannedPage()};window.editScheduled=id=>{editing=db.scheduledPurchases.find(x=>x.id===id&&x.userId===userId);if(editing)render()};window.cancelPlanEdit=()=>{editing=null;render()};window.toggleScheduled=id=>{let x=db.scheduledPurchases.find(y=>y.id===id&&y.userId===userId);if(x&&!x.cancelled)x.active=!x.active;save();plannedPage()};window.cancelScheduled=id=>{let x=db.scheduledPurchases.find(y=>y.id===id&&y.userId===userId);if(x){x.active=false;x.cancelled=true}save();plannedPage()};window.confirmPlannedOrder=id=>{let prompt=db.scheduledOrderPrompts.find(x=>x.id===id&&x.userId===userId&&x.status==='pending'),p=prod(prompt?.productId);if(!prompt||!p||Number(p.stock)<Number(prompt.qty)){alert('Предложение недоступно или остатка недостаточно. Заказ не оформлен.');return}if(!confirm(`Подтвердить демо-заказ: ${p.name}, ${prompt.qty} ${p.unit||'кг'}? Это действие сохранит заказ в демо-истории, деньги не списываются.`))return;db.orders.push({id:crypto.randomUUID(),productId:p.id,userId,qty:prompt.qty,total:prompt.qty*Number(p.price),status:'Подтверждено пользователем · демо',date:new Date().toLocaleDateString('ru-RU')});prompt.status='confirmed';prompt.confirmedAt=new Date().toISOString();save();plannedPage()}}
function ordersPage(){if(!me()){location.hash='#/login';return}let os=db.orders.filter(o=>o.userId===me().id);frame(`<main class="wrap page">${locationLine()}<div class="layout">${side('orders')}<section class="content"><div class="eyebrow">ВАША ИСТОРИЯ</div><h1 class="page-title serif">Мои заказы</h1>${os.length?`<div class="list" style="margin-top:17px">${os.map(o=>`<div class="listitem"><div><b>${esc(prod(o.productId)?.name||'Продукт')}</b><div class="muted" style="font-size:12px;margin-top:5px">${o.qty} кг · ${money(o.total)} · ${esc(o.date)}</div></div><span class="status">${esc(o.status)}</span></div>`).join('')}</div>`:'<div class="empty" style="margin-top:17px">Заказов пока нет. <a href="#/catalog" style="color:var(--green)">Открыть каталог →</a></div>'}</section></div></main>`)}
function auth(register){frame(`<main class="wrap page"><section class="picker" style="max-width:500px"><div class="picker-brand">${logo}<span>Дасторкон</span></div><h1 class="serif">${register?'Демо-регистрация':'Вход в демо'}</h1><p>Учётная запись существует только в этом браузере.</p><form class="form" onsubmit="authSubmit(event,${register})">${register?'<label>Имя и фамилия<input id="name" required></label><label>Ваша роль<select id="role"><option value="buyer">Покупатель / бизнес</option><option value="farmer">Фермер</option></select></label>':''}<label>Электронная почта<input id="email" type="email" required></label><label>Пароль<input id="password" type="password" required></label><button class="btn">${register?'Создать аккаунт':'Войти'}</button><div id="authmsg"></div></form><p style="margin-top:17px;font-size:12px">${register?'Уже есть профиль? <a href="#/login">Войти</a>':'Нет профиля? <a href="#/register">Зарегистрироваться</a>'}</p></section></main>`)}window.authSubmit=(e,register)=>{e.preventDefault();let email=$('#email').value.trim().toLowerCase(),password=$('#password').value;if(register){if(db.users.some(u=>u.email===email)){$('#authmsg').innerHTML='<div class="msg error">Этот адрес уже зарегистрирован.</div>';return}let u={id:crypto.randomUUID(),email,password,name:$('#name').value,role:$('#role').value};db.users.push(u);db.current=u.id}else{let u=db.users.find(x=>x.email===email&&x.password===password);if(!u){$('#authmsg').innerHTML='<div class="msg error">Профиль не найден. Проверьте данные или зарегистрируйтесь.</div>';return}db.current=u.id}if(!db.place&&me()?.place)db.place={...me().place};if(register&&db.place)me().place={...db.place};save();location.hash=db.place?'#/account':'#/location'};
function ratingSummary(id){let a=db.ratings.filter(x=>x.farmerId===id);return{count:a.length,average:a.length?(a.reduce((n,x)=>n+x.stars,0)/a.length).toFixed(1):'—'}}
window.rateFarmer=(e,id)=>{e.preventDefault();let u=me();if(!u){location.hash='#/login';return}if(u.role==='farmer'||u.id===id)return;let stars=Number($('#rating-stars').value),old=db.ratings.find(x=>x.farmerId===id&&x.userId===u.id);if(old)old.stars=stars;else db.ratings.push({farmerId:id,userId:u.id,stars});save();farmerPage(id)};
function farmerPage(id){let u=db.users.find(x=>x.id===id&&x.role==='farmer'),offers=db.products.filter(p=>p.farmerId===id),summary=ratingSummary(id);if(!u){frame(`<main class="wrap page">${locationLine()}<div class="empty">Профиль фермера не найден. <a href="#/catalog">К предложениям</a></div></main>`);return}let rated=me()&&db.ratings.some(x=>x.farmerId===id&&x.userId===me().id);frame(`<main class="wrap page">${db.place?locationLine():''}<div class="layout">${side('catalog')}<section class="content"><div class="eyebrow">ФЕРМЕР · ПРОФИЛЬ</div><h1 class="page-title serif">${esc(u.farmName||u.name)}</h1><p class="muted">${esc(u.name)} · ${esc(offers[0]?.locality||'Кыргызстан')}</p><div class="panel" style="margin:16px 0"><div class="row"><div><div style="font-size:25px;color:#9a7020">★ ${summary.average}</div><div class="muted">${summary.count?`${summary.count} оценок`:'Пока нет оценок'}</div></div><span class="status">Фермер Dastorkon</span></div>${me()&&me().role!=='farmer'?`<form class="form" onsubmit="rateFarmer(event,'${esc(id)}')"><label>Ваша оценка<select id="rating-stars"><option value="5">★★★★★ · Отлично</option><option value="4">★★★★☆ · Хорошо</option><option value="3">★★★☆☆ · Нормально</option><option value="2">★★☆☆☆ · Ниже ожиданий</option><option value="1">★☆☆☆☆ · Плохо</option></select></label><button class="btn">${rated?'Обновить оценку':'Оценить фермера'}</button></form>`:!me()?'<p class="muted">Войдите как покупатель, чтобы оценить фермера.</p>':''}</div><div class="section-head"><div><div class="eyebrow">КАТАЛОГ ФЕРМЫ</div><h2 class="serif">Предложения</h2></div></div><div class="cards">${offers.length?offers.map(card).join(''):'<div class="empty">У этой фермы пока нет предложений.</div>'}</div></section></div></main>`)}
function accountPage(){if(!me()){location.hash='#/login';return}let u=me(),mine=db.orders.filter(o=>o.userId===u.id),own=db.products.filter(p=>p.farmerId===u.id);frame(`<main class="wrap page">${db.place?locationLine():''}<div class="layout">${side('account')}<section class="content"><div class="eyebrow">ДЕМО-ПРОФИЛЬ · ${u.role==='farmer'?'ФЕРМЕР':'ПОКУПАТЕЛЬ'}</div><h1 class="page-title serif">Здравствуйте, ${esc(u.name.split(' ')[0])}</h1><div class="panel" style="margin-top:17px"><p><b>Имя:</b> ${esc(u.name)}</p><p><b>Почта:</b> ${esc(u.email)}</p><p><b>Роль:</b> ${u.role==='farmer'?'Фермер':'Покупатель / бизнес'}</p><p><b>Местоположение:</b> ${esc(u.place?`${u.place.regionName} · ${u.place.localityName}`:'Не выбрано')}</p><a class="btn soft small" href="#/location">Выбрать / изменить местоположение</a>${u.role==='farmer'?`<p><b>Рейтинг:</b> ★ ${ratingSummary(u.id).average} · ${ratingSummary(u.id).count} оценок</p><a class="btn soft small" href="#/farmer/${encodeURIComponent(u.id)}">Открыть публичную страницу фермы</a>`:''}<button class="btn soft" onclick="logout()">Выйти из демо-профиля</button></div>${u.role==='farmer'?`<div class="panel" style="margin-top:13px"><h2 style="margin-top:0">Опубликовать предложение</h2><p class="muted">Укажите товар, цену и местоположение. Предложение сразу появится в каталоге выбранного региона.</p><form id="offerform" class="form" onsubmit="publishOffer(event)"><label>Название продукта<input id="offername" list="product-types" required placeholder="Например, картофель"><datalist id="product-types">${Object.values(categories).flat().map(x=>`<option value="${esc(x)}">`).join('')}</datalist></label><label>Название фермы<input id="farmname" required value="${esc(u.farmName||'')}" placeholder="Ферма «Ала-Тоо»"></label><label>Цена за единицу, сом<input id="offerprice" type="number" min="1" step="0.01" required placeholder="Например, 35"></label><label>Единица<select id="offerunit"><option value="кг">кг</option><option value="л">л</option><option value="шт">шт.</option></select></label><label>Наличие<input id="offerstock" type="number" min="1" step="1" required placeholder="Доступный объём"></label><label>Категория<select id="offercat">${Object.keys(categories).map(c=>`<option>${esc(c)}</option>`).join('')}</select></label><label>Регион фермы<select id="offerregion" onchange="fillOfferLocalities()"><option value="">Выберите регион</option>${Object.entries(regions).map(([id,r])=>`<option value="${esc(id)}" ${(db.place?.region||u.place?.region)===id?'selected':''}>${esc(r.name)}</option>`).join('')}</select></label><label>Город / село<select id="offerloc" required onchange=""></select></label><label>Фото товара<input id="offerphoto" type="file" accept="image/*"><small class="muted">Фото сжимается в браузере перед сохранением.</small></label><label>Описание<textarea id="offerdesc" class="field" rows="4" required placeholder="Расскажите о продукте, урожае и условиях поставки"></textarea></label><button class="btn">Опубликовать предложение</button><div id="offer-msg"></div></form></div><div class="panel" style="margin-top:13px"><h2 style="margin-top:0">Мои предложения · ${own.length}</h2><div class="cards">${own.length?own.map(card).join(''):'<p class="muted">Вы ещё не публиковали предложения.</p>'}</div></div>`:`<div class="panel" style="margin-top:13px"><b>Ваши заказы</b><p class="muted">${mine.length} заказ(ов) в демо-режиме</p><a href="#/orders" class="btn">Перейти к заказам</a></div>`}</section></div></main>`);if(u.role==='farmer'&&$('#offerregion')?.value)window.fillOfferLocalities()}
window.logout=()=>{db.current=null;save();location.hash='#/'};
function route(){let h=decodeURIComponent(location.hash.slice(1)||'/'),[path,id]=h.split('/').filter(Boolean);if(!path||path==='location')start();else if(path==='catalog'||path==='search')catalogPage(path==='search');else if(path==='national')catalogPage(false,true);else if(path==='product')productPage(id);else if(path==='farmer')farmerPage(id);else if(path==='groups')groupsPage();else if(path==='orders')ordersPage();else if(path==='planned')plannedPage();else if(path==='account'||path==='profile')accountPage();else if(path==='login')auth(false);else if(path==='register')auth(true);else start()}
window.addEventListener('hashchange',route);route();
})();
</script></body></html>
