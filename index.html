function fillDistricts(){let r=$('#region').value,l=$('#locality');l.innerHTML='<option value="">Выберите населённый пункт</option>';l.disabled=!r;if(r)Object.entries(regions[r].districts).forEach(([id,x])=>x.localities.forEach(name=>l.add(new Option(`${name} · ${x.name}`,`${id}|${name}`))));checkLocation()}

window.setPlace=()=>{let r=$('#region').value,value=$('#locality').value;if(!r||!value)return;let [d,l]=value.split('|'),x=regions[r].districts[d];db.place={region:r,regionName:regions[r].name,district:d,districtName:x.name,locality:l,localityName:l};save();location.hash='#/catalog'};function art(p){return `<div class="art"><span class="tag">${esc(p.category)}</span><span class="demo">ДЕМО</span><span class="food">${esc(p.emoji||'🌱')}</span></div>`}function card(p){return `<article class="product">${art(p)}<div class="pbody"><div class="row"><a class="p-title" href="#/product/${encodeURIComponent(p.id)}">${esc(p.name)}</a><span class="price">${money(Number(p.price))}<small>/${esc(p.unit)}</small></span></div><div class="farm">🌱 ${p.farmerId?`<a href="#/farmer/${encodeURIComponent(p.farmerId)}">${esc(p.farm)} · профиль фермера →</a>`:esc(p.farm)}</div><p class="place">⌖ ${esc(p.districtName||regions[p.region]?.districts[p.district]?.name||'Чуйская область')} · ${esc(p.locality)}</p><p class="quantityline">Заказ от 1 ${esc(p.unit)} · в наличии ${esc(p.stock)} ${esc(p.unit)}</p><div class="cardactions"><a class="btn soft" href="#/product/${encodeURIComponent(p.id)}">Подробнее</a><a class="btn" href="#/product/${encodeURIComponent(p.id)}">Заказать</a></div></div></article>`}

function scopedProducts(){return db.products.filter(p=>p.region===db.place.region)}function catalogPage(searchMode=false){if(!db.place){location.hash='#/location';return}let list=scopedProducts();frame(`<main class="wrap page">${locationLine()}<div class="layout">${side(searchMode?'search':'catalog')}<section class="content"><div class="section-head"><div><div class="eyebrow">ПРЕДЛОЖЕНИЯ ПО ВАШЕЙ МЕСТНОСТИ</div><h1 class="serif">${searchMode?'Умный поиск':'Каталог продуктов'}</h1></div><span class="status">${esc(db.place.regionName)}</span></div><div class="filters"><input id="q" placeholder="⌕  Что ищете? Например, картошка"><label>Количество, кг<input id="qty" type="number" min="0" placeholder="Например, 100"></label><select id="cat"><option value="">Все категории</option>${[...new Set(list.map(p=>p.category))].map(c=>`<option>${esc(c)}</option>`).join('')}</select><button class="btn" onclick="filterCards()">Найти</button></div><div class="resultnote" id="count"></div><div id="cards" class="cards"></div></section></div></main>`);window.filterCards=()=>{let q=$('#q').value.trim().toLowerCase(),qty=Number($('#qty').value)||0,cat=$('#cat').value;let found=list.filter(p=>(!q||p.name.toLowerCase().includes(q)||p.category.toLowerCase().includes(q)||p.farm.toLowerCase().includes(q))&&(!cat||p.category===cat)&&p.stock>=qty&&p.min<=Math.max(qty,p.min));$('#count').textContent=`Найдено предложений: ${found.length}${qty?` · доступно не меньше ${qty} кг`:''}`;$('#cards').innerHTML=found.length?found.map(card).join(''):`<div class="empty"><div style="font-size:34px">⌕</div><b>В этой местности пока нет подходящих предложений</b><p>Измените запрос или количество либо выберите другую локацию.</p><button class="btn soft" onclick="location.hash='#/location'">Изменить локацию</button></div>`};$('#q').addEventListener('input',filterCards);$('#qty').addEventListener('input',filterCards);$('#cat').addEventListener('change',filterCards);filterCards()}
window.publishOffer=e=>{e.preventDefault();let u=me();if(!u||u.role!=='farmer')return;let name=$('#offername').value.trim(),farm=$('#farmname').value.trim(),loc=$('#offerloc').value.trim(),price=Number($('#offerprice').value),stock=Number($('#offerstock').value),category=$('#offercat').value,desc=$('#offerdesc').value.trim(),unit=$('#offerunit').value;if(!name||!farm||!loc||!desc||price<=0||stock<=0)return;u.farmName=farm;let place=db.place||{region:'chui',regionName:'Чуйская область',district:'moscow',districtName:'Московский район'};let item={id:crypto.randomUUID(),name,category,price,unit,min:1,stock,farm,farmerId:u.id,region:place.region,regionName:place.regionName,district:place.district,districtName:place.districtName,locality:loc,emoji:'🌱',desc};db.products.unshift(item);save();$('#offer-msg').innerHTML='<div class="msg">Предложение опубликовано и появилось в каталоге.</div>';$('#offerform').reset();setTimeout(()=>accountPage(),700)};
function productPage(id){if(!db.place){location.hash='#/location';return}let p=prod(id);if(!p||p.region!==db.place.region){frame(`<main class="wrap page">${locationLine()}<div class="empty">В выбранной местности товар не найден. <a href="#/catalog">Назад к предложениям</a></div></main>`);return}frame(`<main class="wrap page">${locationLine()}<div class="layout">${side('catalog')}<section class="content"><a class="muted" href="#/catalog">← Назад к предложениям</a><div class="detail" style="margin-top:15px">${art(p)}<div><div class="eyebrow">${esc(p.category)} · ПРЕДЛОЖЕНИЕ</div><h1 class="page-title serif">${esc(p.name)}</h1><p class="farm">🌱 ${p.farmerId?`<a href="#/farmer/${encodeURIComponent(p.farmerId)}">${esc(p.farm)} · Смотреть ферму →</a>`:esc(p.farm)}</p><p class="muted">${esc(p.desc)}</p><p class="place">⌖ ${esc(p.regionName||'')} · ${esc(p.districtName||'')} · ${esc(p.locality)}</p>${p.farmerId?`<a class="btn soft small" href="#/farmer/${encodeURIComponent(p.farmerId)}">Профиль фермера · ★ ${ratingSummary(p.farmerId).average}</a>`:''}<div class="box" style="margin:16px 0"><div class="row"><span>Цена</span><b class="price">${money(p.price)} / ${esc(p.unit)}</b></div><div class="row" style="margin-top:10px"><span>Минимальный заказ</span><b>1 ${esc(p.unit)}</b></div><div class="row" style="margin-top:10px"><span>Доступно</span><b>${p.stock} ${esc(p.unit)}</b></div></div><form class="form" onsubmit="orderProduct(event,'${esc(p.id)}')"><label>Количество (${esc(p.unit)})<input id="orderqty" type="number" min="1" max="${p.stock}" placeholder="Например, 25" required></label><button class="btn">Добавить демо-заказ</button><div id="ordermsg"></div></form><p class="muted" style="font-size:11px;margin-top:12px">Демо-заказ сохраняется в браузере.</p></div></div></section></div></main>`)}
window.orderProduct=(e,id)=>{e.preventDefault();if(!me()){location.hash='#/login';return}let p=prod(id),qty=Number($('#orderqty').value);if(qty<1||qty>p.stock){$('#ordermsg').innerHTML='<div class="msg error">Проверьте минимальный и доступный объём.</div>';return}db.orders.push({id:crypto.randomUUID(),productId:id,userId:me().id,qty,total:qty*p.price,status:'В обработке',date:new Date().toLocaleDateString('ru-RU')});save();$('#ordermsg').innerHTML='<div class="msg">Заказ сохранён в демо-разделе «Мои заказы».</div>'};
function groupsPage(){if(!db.place){location.hash='#/location';return}const reserved=p=>db.groups.filter(g=>g.productId===p.id).reduce((n,g)=>n+Number(g.target||0),0),freeStock=p=>Math.max(0,Number(p.stock)-reserved(p));frame(`<main class="wrap page">${locationLine()}<div class="layout">${side('groups')}<section class="content"><div class="eyebrow">СОВМЕСТНЫЕ ЗАКУПКИ ДЛЯ КАФЕ И РЕСТОРАНОВ</div><h1 class="page-title serif">Групповые закупки</h1><p class="muted">Откройте сбор на нужный общий объём. Другие кафе укажут свою часть заказа и присоединятся к той же ферме.</p><div class="panel" style="margin:16px 0"><h2 style="margin-top:0">Открыть новую закупку</h2><form class="form" onsubmit="createGroup(event)"><label>Сколько всего нужно?<input id="gtarget" type="number" min="1" step="1" placeholder="Например, 500 кг" required></label><label>Выберите предложение фермера<select id="gproduct" required></select></label><div class="muted" id="gstocknote" style="font-size:12px">Сначала укажите общий объём — покажем фермеров, у которых он есть в наличии.</div><button class="btn">Открыть сбор</button><div id="gmsg"></div></form></div><div class="section-head"><div><div class="eyebrow">ПРИСОЕДИНЯЙТЕСЬ К ЗАКУПКАМ</div><h2 class="serif">Открытые сборы</h2></div></div><div id="grouplist" class="list"></div></section></div></main>`);let targetEl=$('#gtarget'),productEl=$('#gproduct');function fillOfferOptions(){let target=Number(targetEl.value)||1,available=scopedProducts().filter(p=>freeStock(p)>=target);productEl.innerHTML=available.length?available.map(p=>`<option value="${esc(p.id)}">${esc(p.name)} · ${esc(p.farm)} · есть ${freeStock(p)} ${esc(p.unit||'кг')}</option>`).join(''):'<option value="">Нет предложений с таким объёмом</option>';$('#gstocknote').textContent=available.length?`Найдено фермеров: ${available.length}. Объём каждого предложения не меньше ${target} кг.`:`В этой местности нет фермера с ${target} кг в наличии. Уменьшите объём или выберите другую местность.`}targetEl.addEventListener('input',fillOfferOptions);fillOfferOptions();window.createGroup=e=>{e.preventDefault();if(!me()){location.hash='#/login';return}if(me().role==='farmer'){$('#gmsg').innerHTML='<div class="msg error">Закупку может открыть покупатель или кафе.</div>';return}let p=prod(productEl.value),target=Number(targetEl.value);if(!p||target<1||freeStock(p)<target){$('#gmsg').innerHTML='<div class="msg error">Проверьте объём и наличие у выбранного фермера.</div>';return}db.groups.push({id:crypto.randomUUID(),productId:p.id,target,current:0,participants:[],ownerId:me().id,place:db.place});save();drawGroups()};window.joinGroup=(id,inputId)=>{if(!me()){location.hash='#/login';return}if(me().role==='farmer'){alert('К закупке могут присоединиться кафе и покупатели.');return}let g=db.groups.find(x=>x.id===id),qty=Number(document.getElementById(inputId)?.value),p=prod(g?.productId),remaining=g.target-g.current;if(!g||!qty||qty<1||qty>remaining||qty>Number(p?.stock)){let msg=document.getElementById('joinmsg-'+id);if(msg)msg.textContent=`Укажите от 1 до ${Math.min(remaining,Number(p?.stock)||0)} ${p?.unit||'кг'}.`;return}g.current+=qty;g.participants.push({userId:me().id,name:me().name,qty});save();drawGroups()};function drawGroups(){let gs=db.groups.filter(g=>g.place?.region===db.place.region&&g.place?.district===db.place.district&&g.place?.locality===db.place.locality),el=$('#grouplist');el.innerHTML=gs.length?gs.map(g=>{let p=prod(g.productId);if(!p)return'';let pct=Math.min(100,Math.round(g.current/g.target*100)),remain=Math.max(0,g.target-g.current);return `<article class="panel"><div class="row"><b>${esc(p.name)}</b><span class="status">${pct>=100?'Объём набран':'Набор открыт'}</span></div><p class="muted" style="font-size:12px;margin:7px 0"><a href="#/product/${encodeURIComponent(p.id)}">${esc(p.farm)} · предложение фермы →</a> · всего нужно ${g.target} ${esc(p.unit||'кг')}</p><div class="progress"><i style="width:${pct}%"></i></div><div class="row muted" style="font-size:12px"><span>Уже заказали ${g.current} ${esc(p.unit||'кг')}</span><span>Осталось ${remain} ${esc(p.unit||'кг')}</span></div>${g.participants.length?`<div class="muted" style="font-size:12px;margin-top:10px">${g.participants.map(x=>`${esc(x.name||db.users.find(u=>u.id===x.userId)?.name||'Кафе')} — ${x.qty} ${esc(p.unit||'кг')}`).join(' · ')}</div>`:''}${pct<100?`<div class="form" style="grid-template-columns:1fr auto;align-items:end"><label>Ваше количество, ${esc(p.unit||'кг')}<input id="joinqty-${esc(g.id)}" type="number" min="1" max="${remain}" step="1" placeholder="Например, 30"></label><button class="btn small" onclick="joinGroup('${esc(g.id)}','joinqty-${esc(g.id)}')">Присоединиться</button></div><div id="joinmsg-${esc(g.id)}" class="muted" style="font-size:12px"></div>`:'<div class="msg">Общий объём набран. Ферма может подготовить заказ.</div>'}</article>`}).join(''):'<div class="empty">Пока нет открытых сборов. Откройте закупку выше или проверьте другую местность.</div>'}drawGroups()}
function ordersPage(){if(!me()){location.hash='#/login';return}let os=db.orders.filter(o=>o.userId===me().id);frame(`<main class="wrap page">${locationLine()}<div class="layout">${side('orders')}<section class="content"><div class="eyebrow">ВАША ИСТОРИЯ</div><h1 class="page-title serif">Мои заказы</h1>${os.length?`<div class="list" style="margin-top:17px">${os.map(o=>`<div class="listitem"><div><b>${esc(prod(o.productId)?.name||'Продукт')}</b><div class="muted" style="font-size:12px;margin-top:5px">${o.qty} кг · ${money(o.total)} · ${esc(o.date)}</div></div><span class="status">${esc(o.status)}</span></div>`).join('')}</div>`:'<div class="empty" style="margin-top:17px">Заказов пока нет. <a href="#/catalog" style="color:var(--green)">Открыть каталог →</a></div>'}</section></div></main>`)}
function auth(register){frame(`<main class="wrap page"><section class="picker" style="max-width:500px"><div class="picker-brand">${logo}<span>Дасторкон</span></div><h1 class="serif">${register?'Демо-регистрация':'Вход в демо'}</h1><p>Учётная запись существует только в этом браузере.</p><form class="form" onsubmit="authSubmit(event,${register})">${register?'<label>Имя и фамилия<input id="name" required></label><label>Ваша роль<select id="role"><option value="buyer">Покупатель / бизнес</option><option value="farmer">Фермер</option></select></label>':''}<label>Электронная почта<input id="email" type="email" required></label><label>Пароль<input id="password" type="password" required></label><button class="btn">${register?'Создать аккаунт':'Войти'}</button><div id="authmsg"></div></form><p style="margin-top:17px;font-size:12px">${register?'Уже есть профиль? <a href="#/login">Войти</a>':'Нет профиля? <a href="#/register">Зарегистрироваться</a>'}</p></section></main>`)}window.authSubmit=(e,register)=>{e.preventDefault();let email=$('#email').value.trim().toLowerCase(),password=$('#password').value;if(register){if(db.users.some(u=>u.email===email)){$('#authmsg').innerHTML='<div class="msg error">Этот адрес уже зарегистрирован.</div>';return}let u={id:crypto.randomUUID(),email,password,name:$('#name').value,role:$('#role').value};db.users.push(u);db.current=u.id}else{let u=db.users.find(x=>x.email===email&&x.password===password);if(!u){$('#authmsg').innerHTML='<div class="msg error">Профиль не найден. Проверьте данные или зарегистрируйтесь.</div>';return}db.current=u.id}save();location.hash=db.place?'#/account':'#/location'};
function ratingSummary(id){let a=db.ratings.filter(x=>x.farmerId===id);return{count:a.length,average:a.length?(a.reduce((n,x)=>n+x.stars,0)/a.length).toFixed(1):'—'}}
window.rateFarmer=(e,id)=>{e.preventDefault();let u=me();if(!u){location.hash='#/login';return}if(u.role==='farmer'||u.id===id)return;let stars=Number($('#rating-stars').value),old=db.ratings.find(x=>x.farmerId===id&&x.userId===u.id);if(old)old.stars=stars;else db.ratings.push({farmerId:id,userId:u.id,stars});save();farmerPage(id)};
function farmerPage(id){let u=db.users.find(x=>x.id===id&&x.role==='farmer'),offers=db.products.filter(p=>p.farmerId===id),summary=ratingSummary(id);if(!u){frame(`<main class="wrap page">${locationLine()}<div class="empty">Профиль фермера не найден. <a href="#/catalog">К предложениям</a></div></main>`);return}let rated=me()&&db.ratings.some(x=>x.farmerId===id&&x.userId===me().id);frame(`<main class="wrap page">${db.place?locationLine():''}<div class="layout">${side('catalog')}<section class="content"><div class="eyebrow">ФЕРМЕР · ПРОФИЛЬ</div><h1 class="page-title serif">${esc(u.farmName||u.name)}</h1><p class="muted">${esc(u.name)} · ${esc(offers[0]?.locality||'Кыргызстан')}</p><div class="panel" style="margin:16px 0"><div class="row"><div><div style="font-size:25px;color:#9a7020">★ ${summary.average}</div><div class="muted">${summary.count?`${summary.count} оценок`:'Пока нет оценок'}</div></div><span class="status">Фермер Dastorkon</span></div>${me()&&me().role!=='farmer'?`<form class="form" onsubmit="rateFarmer(event,'${esc(id)}')"><label>Ваша оценка<select id="rating-stars"><option value="5">★★★★★ · Отлично</option><option value="4">★★★★☆ · Хорошо</option><option value="3">★★★☆☆ · Нормально</option><option value="2">★★☆☆☆ · Ниже ожиданий</option><option value="1">★☆☆☆☆ · Плохо</option></select></label><button class="btn">${rated?'Обновить оценку':'Оценить фермера'}</button></form>`:!me()?'<p class="muted">Войдите как покупатель, чтобы оценить фермера.</p>':''}</div><div class="section-head"><div><div class="eyebrow">КАТАЛОГ ФЕРМЫ</div><h2 class="serif">Предложения</h2></div></div><div class="cards">${offers.length?offers.map(card).join(''):'<div class="empty">У этой фермы пока нет предложений.</div>'}</div></section></div></main>`)}
function accountPage(){if(!me()){location.hash='#/login';return}let u=me(),mine=db.orders.filter(o=>o.userId===u.id),own=db.products.filter(p=>p.farmerId===u.id);frame(`<main class="wrap page">${db.place?locationLine():''}<div class="layout">${side('account')}<section class="content"><div class="eyebrow">ДЕМО-ПРОФИЛЬ · ${u.role==='farmer'?'ФЕРМЕР':'ПОКУПАТЕЛЬ'}</div><h1 class="page-title serif">Здравствуйте, ${esc(u.name.split(' ')[0])}</h1><div class="panel" style="margin-top:17px"><p><b>Имя:</b> ${esc(u.name)}</p><p><b>Почта:</b> ${esc(u.email)}</p><p><b>Роль:</b> ${u.role==='farmer'?'Фермер':'Покупатель / бизнес'}</p>${u.role==='farmer'?`<p><b>Рейтинг:</b> ★ ${ratingSummary(u.id).average} · ${ratingSummary(u.id).count} оценок</p><a class="btn soft small" href="#/farmer/${encodeURIComponent(u.id)}">Открыть публичную страницу фермы</a>`:''}<button class="btn soft" onclick="logout()">Выйти из демо-профиля</button></div>${u.role==='farmer'?`<div class="panel" style="margin-top:13px"><h2 style="margin-top:0">Опубликовать предложение</h2><p class="muted">Укажите товар, цену и местоположение. Предложение сразу появится в каталоге выбранного региона.</p><form id="offerform" class="form" onsubmit="publishOffer(event)"><label>Название продукта<input id="offername" required placeholder="Например, картофель"></label><label>Название фермы<input id="farmname" required value="${esc(u.farmName||'')}" placeholder="Ферма «Ала-Тоо»"></label><label>Цена за единицу, сом<input id="offerprice" type="number" min="1" step="0.01" required placeholder="Например, 35"></label><label>Единица<select id="offerunit"><option value="кг">кг</option><option value="л">л</option><option value="шт">шт.</option></select></label><label>Наличие<input id="offerstock" type="number" min="1" step="1" required placeholder="Доступный объём"></label><label>Категория<select id="offercat"><option>Овощи</option><option>Фрукты</option><option>Молочная продукция</option><option>Мясо</option><option>Зерновые</option><option>Другое</option></select></label><label>Местоположение<input id="offerloc" required value="${esc(db.place?.localityName||'')}" placeholder="Город или село"></label><label>Описание<textarea id="offerdesc" class="field" rows="4" required placeholder="Расскажите о продукте, урожае и условиях поставки"></textarea></label><button class="btn">Опубликовать предложение</button><div id="offer-msg"></div></form></div><div class="panel" style="margin-top:13px"><h2 style="margin-top:0">Мои предложения · ${own.length}</h2><div class="cards">${own.length?own.map(card).join(''):'<p class="muted">Вы ещё не публиковали предложения.</p>'}</div></div>`:`<div class="panel" style="margin-top:13px"><b>Ваши заказы</b><p class="muted">${mine.length} заказ(ов) в демо-режиме</p><a href="#/orders" class="btn">Перейти к заказам</a></div>`}</section></div></main>`)}
window.logout=()=>{db.current=null;save();location.hash='#/'};
function route(){let h=decodeURIComponent(location.hash.slice(1)||'/'),[path,id]=h.split('/').filter(Boolean);if(!path||path==='location')start();else if(path==='catalog'||path==='search')catalogPage(path==='search');else if(path==='product')productPage(id);else if(path==='farmer')farmerPage(id);else if(path==='groups')groupsPage();else if(path==='orders')ordersPage();else if(path==='account'||path==='profile')accountPage();else if(path==='login')auth(false);else if(path==='register')auth(true);else start()}
window.addEventListener('hashchange',route);route();
})();
</script></body></html>
